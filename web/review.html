<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مراجعة المحاضرة</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .review { max-width: 560px; margin: 0 auto; padding: 1.25rem; display: grid; gap: 1.1rem; align-content: start; min-height: 100vh; }
    .review h1 { font-size: 1.4rem; margin: .4rem 0 0; }
    .review section { border-top: 1px solid var(--hair); padding-top: .8rem; }
    .review h2 { font-size: 1.05rem; margin: 0 0 .3rem; }
    .review ul { margin: 0; padding-inline-start: 1.2rem; line-height: 1.8; }
    .review .tag { color: var(--soft); font-size: .85rem; }
  </style>
</head>
<body>
  <header class="sr-only"><h1>مراجعة المحاضرة</h1></header>
  <main class="review" id="app"><p class="tag">جارٍ التحميل…</p></main>
  <script src="review.js" type="module"></script>
<script src="/orbit-sensor.js" async></script>
</body>
</html>
