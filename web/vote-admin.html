<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إدارة التصويت</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin { max-width: 980px; margin: 0 auto; padding: 1.25rem; display: grid; gap: 1.25rem; }
    .admin .grid { display: grid; grid-template-columns: 280px 1fr; gap: 1.25rem; align-items: start; }
    .admin textarea, .admin input[type=text], .admin input[type=password] {
      font: inherit; width: 100%; padding: 0.6rem; border-radius: 10px; border: 1px solid var(--hair); background: var(--canvas); color: var(--ink);
    }
    .admin .card { border: 1px solid var(--hair); border-radius: 16px; padding: 1rem; background: var(--wash); }
    .admin .poll { border: 1px solid var(--hair); border-radius: 14px; padding: 0.9rem; display: grid; gap: 0.5rem; background: var(--canvas); }
    .admin .bar { height: 10px; border-radius: 6px; background: var(--wash); overflow: hidden; }
    .admin .bar > span { display: block; height: 100%; background: var(--accent); }
    .admin .row { display: grid; gap: 0.2rem; }
    .admin .meta { color: var(--soft); font-size: 0.9rem; }
    .admin .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .word-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .word-chip { border: 1px solid var(--hair); border-radius: 999px; padding: .2rem .6rem; font-size: .9rem; }
    .word-chip.hidden-word { opacity: .5; text-decoration: line-through; }
    .word-chip button { min-height: 28px; padding: .1rem .5rem; font-size: .75rem; margin-inline-start: .3rem; }
    @media (max-width: 760px) { .admin .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="admin" id="app">
    <h1>التصويت</h1>
    <section class="card" id="auth">
      <label>رمز المحاضر (يظهر في الطرفية عند تشغيل الخادم)
        <input type="password" id="token" autocomplete="off" />
      </label>
      <div class="actions"><button class="primary" id="save-token">حفظ</button></div>
      <p class="meta" id="auth-msg"></p>
    </section>
    <section id="panel" hidden class="grid">
      <div class="card">
        <div class="actions"><button class="primary" id="new-session">جلسة جديدة</button></div>
        <p class="meta" id="session-line"></p>
        <div id="qr" role="img" aria-label="رمز QR للطلبة"></div>
        <p class="meta" id="join-url" style="word-break:break-all"></p>
        <label>اسم الشعبة (اختياري)
          <input type="text" id="session-label" maxlength="60" placeholder="مثل: شعبة 2 — الأحد" />
        </label>
        <div class="actions"><button id="save-label" type="button">حفظ الاسم</button></div>
      </div>
      <div class="card">
        <h2>سؤال جديد</h2>
        <div class="row">
          <input type="text" id="q-text" placeholder="نص السؤال" maxlength="200" />
          <select id="q-kind" aria-label="نوع السؤال">
            <option value="choice">اختيار من متعدد</option>
            <option value="words">سحابة كلمات (حتى 3 كلمات لكل طالب)</option>
          </select>
          <textarea id="q-opts" rows="4" placeholder="خيار في كل سطر (2 إلى 6)"></textarea>
          <input type="text" id="q-objective" maxlength="150" placeholder="هدف التعلم (اختياري، يكتبه المحاضر)" />
          <label><input type="checkbox" id="q-change" /> السماح بتغيير الإجابة</label>
          <label><input type="checkbox" id="q-before-after" /> سؤال قبل وبعد الشرح (جولتان منفصلتان)</label>
          <label>رقم الإجابة الصحيحة المعتمدة (اختياري، 1 إلى 6)
            <input id="q-correct" type="number" min="1" max="6" step="1" placeholder="اتركه فارغاً إن لم توجد إجابة صحيحة" />
          </label>
          <div class="actions"><button class="primary" id="add-poll">إضافة السؤال</button></div>
          <p class="meta" id="poll-msg"></p>
        </div>
        <div class="actions" style="margin-top:.6rem">
          <button id="export-poll-aggregates" type="button">تصدير التقرير المجمّع CSV</button>
        </div>
        <div id="polls" class="row" style="margin-top:1rem"></div>
        <details><summary>تغيّر توزيع الإجابات بين جولات السؤال</summary><div id="round-comparisons" class="row"></div></details>
        <details id="objective-summary"><summary>الأسئلة بحسب هدف التعلم</summary><div id="objective-groups" class="row"></div></details>
        <details id="section-compare"><summary>مقارنة الشعب (السؤال نفسه)</summary>
          <div class="actions"><button id="load-section-compare" type="button">تحميل المقارنة</button></div>
          <div id="section-compare-results" class="row" aria-live="polite"></div>
        </details>
        <details id="student-questions-drawer"><summary>أسئلة الطلبة المفتوحة — للمحاضر فقط</summary>
          <p class="meta">راجع الأسئلة واحذف غير المناسب؛ لا تُعرض تلقائياً على شاشة الطلبة. تُخفى الأسئلة المُعلَّمة (إساءة/إزعاج) حتى تفتحها.</p>
          <div id="question-insights" class="row" aria-live="polite"></div>
          <div id="student-questions" class="row" aria-live="polite"></div>
        </details>
      </div>
    </section>
  </main>
  <script src="vendor/qrcode.js"></script>
  <script src="vote-admin.js" type="module"></script>
<script src="/orbit-sensor.js" async></script>
</body>
</html>
