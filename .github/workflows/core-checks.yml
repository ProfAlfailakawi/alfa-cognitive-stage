name: Core regression checks
on:
  push:
  pull_request:
# Repeated feature commits must not exhaust runners; keep push/PR checks independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax
        # Generated from the tracked files so a new module is checked without editing this list.
        run: |
          set -euo pipefail
          files=$(git ls-files 'web/*.js' 'server/*.mjs' 'desktop/*.cjs' 'tools/*.mjs' \
            tests/cognitive-quality.mjs tests/living-intelligence.mjs tests/pulse-linked.mjs)
          test -n "$files"
          for f in $files; do node --check "$f"; done
          echo "node --check passed for $(echo "$files" | wc -l) files"
      - name: JS unit regression
        run: |
          npm run test:build-steps
          npm run test:infographic
          npm run test:director
          npm run test:speech
          npm run test:memory
          npm run test:vote-rounds
          npm run test:import
          npm run test:layouts
          npm run test:media-preflight
          npm run test:scene-store
          npm run test:security
          npm run test:library
          npm run test:engagement
          npm run test:semantic
          npm run test:insight
          npm run test:field-trial
          npm run test:readiness
          npm run test:poll-analytics
          npm run test:living
          npm run test:perf
          npm run test:show
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bundle metadata test
        run: |
          python -m pip install python-pptx lxml Pillow
          npm run test:build

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test browser and fixture tools
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Generate synthetic media lecture
        run: python tools/make_test_fixture.py
      - name: Browser presenter and audience tests
        run: npm run test:e2e
      - name: Living Intelligence interactive presenter and audience integration
        env:
          LIVING_SHOTS: /tmp/alfa-living-shots
        run: npm run test:e2e-living
      - name: PowerPoint build steps and exact return after digressions
        run: npm run test:e2e-return
      - name: Memory controls and conservative preference learning
        run: npm run test:e2e-memory
      - name: Course library, rehearsal, session summary and data controls
        run: npm run test:e2e-library
      - name: Word cloud, moderated questions, summaries and section comparison
        run: npm run test:e2e-engagement
      - name: Understanding pulse, number witness, coach, student review and rehearsal audience
        run: npm run test:e2e-insight
      - name: Resume after a crash, field trial with labelling, timed rehearsal, course map and guest mode
        run: npm run test:e2e-field
      - name: Local semantic slide matching (hint path runs only where the model is installed)
        run: npm run test:e2e-semantic
      - name: Animated scenes - no clipping, calm motion, reduced-motion, exact text
        run: npm run test:e2e-scenes
      - name: Spoken slide navigation - strict commands, video guard, undo
        run: npm run test:e2e-voicenav
      - name: Presentation Engine - projector and notes windows through the local server (late join, reload, blackout, privacy)
        run: npm run test:e2e-show
      - name: "Voice path (scripted recogniser) - engines, latency, offline, denied mic, video"
        run: npm run test:e2e-speech
      - name: Upload Living Intelligence browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfa-living-visual-checks
          path: /tmp/alfa-living-shots/
          if-no-files-found: ignore
      - name: Long-session stability, leaks, idle CPU and CSP violations
        run: npm run test:e2e-stress
      - name: Five-phone browser voting and persistence test
        run: npm run test:vote

  desktop:
    # The ALFA Mac app's logic in Electron on a virtual display: windows, placement on a simulated
    # projector, focus, privacy, unplug/replug, notes window, clean quit. Not a real macOS projector test.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Electron, Playwright and fixture tools
        run: |
          npm install --no-save playwright@1.56.0 electron@$(node -p "require('./desktop/versions.json').electron")
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb libnss3 libgbm1 libasound2t64
      - name: Engine and display manager unit tests
        run: npm run test:show
      - name: Generate synthetic media lecture
        run: python tools/make_test_fixture.py
      - name: Mac app (Electron) end to end on a virtual display
        run: xvfb-run -a npm run test:desktop
  import-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PowerPoint conversion tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-impress poppler-utils ffmpeg
          python -m pip install python-pptx lxml Pillow
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Generate and import real PowerPoint
        run: |
          python tools/make_test_pptx.py /tmp/alfa-ci-lecture.pptx
          ALFA_WEBM_BACKUP=1 node tests/import-real.mjs
      - name: Click-build rendering tests (LibreOffice)
        run: |
          cd tools && python -m unittest test_animations -v
      - name: Import PowerPoint with click builds and step through it
        run: |
          python tools/animated_fixture.py /tmp/alfa-animated.pptx
          node tests/import-animated.mjs
      - name: Import formats and video compatibility (PDF, Keynote failure path, codecs)
        run: |
          cd tools && python -m unittest test_import_formats -v
      - name: Import a PDF through the server
        run: |
          (cd tools && python make_test_pdf.py /tmp/alfa-test.pdf)
          node tests/import-pdf.mjs
