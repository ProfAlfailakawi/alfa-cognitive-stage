name: Core regression checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax
        run: |
          node --check server/server.mjs
          node --check server/lecture-import.mjs
          node --check server/scene-store.mjs
          node --check server/security.mjs
          node --check server/director-ai.mjs
          node --check server/director-cost.mjs
          node --check server/director-quota.mjs
          node --check web/app.js
          node --check web/build-steps.js
          node --check web/return-stack.js
          node --check web/import-ui.js
          node --check web/scene-layouts.js
          node --check web/lecture-readiness.js
          node --check web/media-preflight.js
          node --check web/director-core.js
          node --check web/session-log.js
          node --check web/lecture-clock.js
          node --check web/rehearsal.js
          node --check web/library-ui.js
          node --check server/library.mjs
          node --check server/votes.mjs
          node --check web/semantic-index.js
          node --check web/director-taste.js
          node --check web/director-brain.js
          node --check web/speech-director.js
          node --check web/latency-meter.js
          node --check web/vote-admin.js
          node --check web/moderation.js
          node --check web/engagement-insights.js
          node --check web/poll-analytics.js
          node --check web/vote.js
          node --check web/review.js
          node --check web/field-recorder.js
          node --check web/field-ui.js
          node --check web/resume-state.js
          node --check web/course-map.js
          node --check web/rehearsal-audience.js
          node --check web/guest.js
          node --check web/voice-nav.js
          node --check web/scene-kit.js
          node --check web/scene-icons.js
          node --check web/insight-ui.js
          node --check web/number-witness.js
          node --check web/lecture-coach.js
          node --check web/review-builder.js
          node --check web/audience-sim.js
      - name: JS unit regression
        run: |
          npm run test:build-steps
          npm run test:infographic
          npm run test:director
          npm run test:speech
          npm run test:director-ai
          npm run test:memory
          npm run test:vote-rounds
          npm run test:import
          npm run test:layouts
          npm run test:media-preflight
          npm run test:scene-store
          npm run test:security
          npm run test:library
          npm run test:engagement
          npm run test:insight
          npm run test:field-trial
          npm run test:readiness
          npm run test:poll-analytics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bundle metadata test
        run: |
          python -m pip install python-pptx lxml Pillow
          npm run test:build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test browser and fixture tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Generate synthetic media lecture
        run: python tools/make_test_fixture.py
      - name: Browser presenter and audience tests
        run: npm run test:e2e
      - name: PowerPoint build steps and exact return after digressions
        run: npm run test:e2e-return
      - name: Memory controls and conservative preference learning
        run: npm run test:e2e-memory
      - name: Course library, rehearsal, session summary and data controls
        run: npm run test:e2e-library
      - name: Word cloud, moderated questions, summaries and section comparison
        run: npm run test:e2e-engagement
      - name: Understanding pulse, number witness, coach, student review and rehearsal audience
        run: npm run test:e2e-insight
      - name: Resume after a crash, field trial with labelling, timed rehearsal, course map and guest mode
        run: npm run test:e2e-field
      - name: Animated scenes - no clipping, calm motion, reduced-motion, exact text
        run: npm run test:e2e-scenes
      - name: Spoken slide navigation - strict commands, video guard, undo
        run: npm run test:e2e-voicenav
      - name: "Voice path (scripted recogniser) - engines, latency, offline, denied mic, video"
        run: npm run test:e2e-speech
      - name: Long-session stability, leaks, idle CPU and CSP violations
        run: npm run test:e2e-stress
      - name: Five-phone browser voting and persistence test
        run: npm run test:vote

  import-real:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PowerPoint conversion tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-impress poppler-utils ffmpeg
          python -m pip install python-pptx lxml Pillow
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Generate and import real PowerPoint
        run: |
          python tools/make_test_pptx.py /tmp/alfa-ci-lecture.pptx
          ALFA_WEBM_BACKUP=1 node tests/import-real.mjs
      - name: Click-build rendering tests (LibreOffice)
        run: |
          cd tools && python -m unittest test_animations -v
      - name: Import PowerPoint with click builds and step through it
        run: |
          python tools/animated_fixture.py /tmp/alfa-animated.pptx
          node tests/import-animated.mjs
      - name: Import formats and video compatibility (PDF, Keynote failure path, codecs)
        run: |
          cd tools && python -m unittest test_import_formats -v
      - name: Import a PDF through the server
        run: |
          (cd tools && python make_test_pdf.py /tmp/alfa-test.pdf)
          node tests/import-pdf.mjs
