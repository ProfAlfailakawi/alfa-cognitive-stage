name: Core regression checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax
        run: |
          node --check server/server.mjs
          node --check server/importer.mjs
          node --check server/readiness.mjs
          node --check server/scene-library.mjs
          node --check server/director-ai.mjs
          node --check web/app.js
          node --check web/director-core.js
          node --check web/storyboard.js
          node --check web/speech-director.js
          node --check web/vote-admin.js
          node --check web/vote.js
      - name: JS unit regression
        run: |
          npm run test:infographic
          npm run test:director
          npm run test:story
          npm run test:director-ai
          npm run test:memory
          npm run test:library
          npm run test:library-api
          npm run test:import
          npm run test:readiness
          npm run test:vote-rounds
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bundle metadata test
        run: |
          python -m pip install python-pptx lxml Pillow
          npm run test:build

  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Check presenter, audience, scenes and voting on Chromium
        run: |
          npm run test:browser-smoke
          npm run test:vote

  real-pptx:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install conversion and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-impress poppler-utils ffmpeg
          python -m pip install python-pptx Pillow lxml
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Convert actual PPTX with embedded video
        run: npm run test:real-pptx
